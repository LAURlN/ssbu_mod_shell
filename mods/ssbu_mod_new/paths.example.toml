# Copy this file to paths.toml and set values for your device.
# Keep paths.toml private/local; it is ignored by Git.

[workspace]
root = "."
old_root = ""

[dumps]
arc = "dumps/arc"
exefs = "dumps/exefs/13.0.4"
scripts = "dumps/scripts/SSBU-Dumped-Scripts-main"

[toolchain]
python312 = "python"
msys2_mingw = ""
cargo_skyline = "3.5.0"
ghidra = "11.1.2"
