arc_network_dll = ""
effect_converter = ""
roslyn_csc = ""
dotnet_runtime = ""
hero_effect_converter = "builds/.cache/hero_effect_converter/bin/EffectConverter.exe"

[switch]
sd_drive = ""
arc_network_ip = ""
