  - id: pikachu-airb-retarget-and-two-byte-motion-delta
    tier: B
    measured: 2026-10-03
    canonical: handbook/04_motion_lists_animation.md#retargeting-a-donor-air-clip-onto-the-eflame-pair-pikachu-airb-100-b-2026-10-03
    tool: tools/audit_pikachu_airb_donor.py 1.0.0, tools/audit_pikachu_airb_delta.py 1.0.0
    evidence: evidence/2026-10-03_pgwr_pikachu_airb/RESULT.md
    note: c05attackairb keeps 45 of 55 Transform nodes (dropped EarL1/L2 EarR1/R2 Hat Have Tail1-4) with 0 parent-name mismatches, donor Visibility 38 rebuilt from the recipient's own 98-node idle, all 17 tracked limbs move (ToeL/ToeR by translation only, 0 deg rotation); per slot attack_air_b differs at exactly 2 offsets [16,62] (flags 0x0080->0x0084, cancel 296->300) and landing_air_b at 0, because the recipient landing entry is already byte-identical to the donor's
  - id: an-unmodified-snapshot-rebuild-reproduces-the-baseline-nro
    tier: B
    measured: 2026-10-03
    canonical: handbook/05_acmd_porting.md#porting-an-air-attack-whose-landing-is-a-second-move-pikachu-airb-100-b-2026-10-03
    tool: builds/.cache/pikachu-airb/build.cmd (cargo skyline build --release --features snake-neutral-b,hero-side-b,hero-mana-hud -- --offline)
    evidence: evidence/2026-10-03_pgwr_pikachu_airb/RESULT.md
    input_sha256: 424914c18e740aea67c37ed399ffe5a22208b76f10dec81e279a8285198b777e
    note: building a pristine copy of builds/.cache/silent-0.20.23/plugin with the build_command recorded in builds/pgwr/0.20.23/MANIFEST.json reproduced the installed baseline NRO byte for byte, which is what makes the pikachu-airb NRO 9d0ee7ed... attributable to this task alone; building with only hero-side-b instead produced a 487424-byte NRO, so the manifest's build_command is the specification and not the Cargo.toml feature defaults
  - id: a-build-report-that-outran-its-artefact
    tier: B
    measured: 2026-10-03
    canonical: handbook/05_acmd_porting.md#porting-an-air-attack-whose-landing-is-a-second-move-pikachu-airb-100-b-2026-10-03
    tool: src/pgwr/tools/build_pikachu_airb.py 1.0.0 (patch_motion_list)
    evidence: evidence/2026-10-03_pgwr_pikachu_airb/RESULT.md
    note: patch_motion_list returned the spliced motion_list.bin bytes in its report without writing them, so the build report claimed cancel 296->300 with 2 differing bytes for both slots while the staged file stayed byte-identical to the baseline; only the delta audit re-reading the packaged file from disk caught it, so a builder that returns bytes must assert the read-back and a shipping audit must never take the builder's word for a file
  - id: a-green-tail-is-not-a-passing-test
    tier: B
    measured: 2026-10-03
    canonical: handbook/05_acmd_porting.md#porting-an-air-attack-whose-landing-is-a-second-move-pikachu-airb-100-b-2026-10-03
    tool: tools/audit_pikachu_airb_delta.py 1.0.0
    evidence: evidence/2026-10-03_pgwr_pikachu_airb/RESULT.md
    note: >-
      piping every audit run through tail hid the tool's exit status; recaptured,
      --negative-controls exited 1 on a fully passing run and printed "FAIL: 0
      control(s) not caught", because the damage controls stored caught=True when
      the audit rejected them while the positive control stored caught=not ok, so one
      key held opposite meanings and the exit test read the wrong row; controls now
      carry ok plus kind=damage|positive, and the failure path was proven live by
      disabling one damage in the real file and requiring a non-zero exit before
      restoring the file and re-checking its sha256
