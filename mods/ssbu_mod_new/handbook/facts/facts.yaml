  - id: install-card-autodetect-needs-mount-not-glob
    tier: B
    measured: 2026-10-02
    canonical: evidence/2026-10-02_pgwr_T-0042/INSTALL.md
    tool: src/pgwr/install-to-card.sh
    evidence: evidence/install-record-2026-10-02_002850.json
    note: the volume scan `ls -d /[a-z]` returns nothing in Git Bash on Windows, so card autodetect failed on this machine and the installer refused to run at all; replaced with mount/df enumeration plus an a-z fallback, contents-based identity test unchanged
  - id: asset-only-variant-installed-by-reused-nro-flag
