[package]
name = "pmclone_moveset"
version = "0.1.0"
edition = "2021"

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
crate-type = ["cdylib"]

[features]
default = []
acmd_port = []

[dependencies]
clone_engine_api = { path = "../upstream/clone_engine/clone_engine_api" }
skyline = { git = "https://github.com/ultimate-research/skyline-rs.git", rev = "6b52d321275639f26c2371d8142550ba0013a5e4" }
smash_script = { git = "https://github.com/WuBoytH/smash-script.git", rev = "24c5b69b79c7d7b041c3993ecd766ceccf950c2b" }
smashline = { git = "https://github.com/HDR-Development/smashline", rev = "df194a03b918116adb7bda1c2b4565dcd82a4756" }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
